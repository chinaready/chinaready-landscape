      Companies can participate by opening a pull request that adds or improves company profiles in `landscape.yml`, supplies SVG logos in `hosted_logos/`, and includes concise source-backed notes for China-market relevance. A complete contribution should identify the product category, official website, developer documentation, global alternatives, organization overview, and any GitHub or social links that help foreign developers evaluate the service.

      Before opening a pull request, run `npm run validate`, `npm run build`, and `npm run verify`.

  - category: "Infrastructure & Edge"
    content: |
      Chinaready tracks infrastructure and edge services that global software teams need when preparing a China launch. This category covers cloud platforms, DNS, and CDN providers used to host and accelerate applications for mainland China users. China deployments often require region-specific cloud accounts, ICP filing, and CDN choices that differ from a global default stack.
    subcategories:
      - subcategory: "Cloud Platform & Hosting"
        content: |
          Use this category for cloud platforms or China-region cloud offerings that can host application workloads.

          Typical global services: [AWS](/alternatives/aws.html), [Microsoft Azure](/alternatives/microsoft-azure.html), [Google Cloud](/alternatives/google-cloud.html).
      - subcategory: "Managed DNS Provider"
        content: |
          Use this category for managed DNS services. Current coverage is thin; prefer products with clear mainland China DNS and domain-routing documentation.

          Typical global services: Cloudflare DNS, AWS Route 53, Google Cloud DNS.
      - subcategory: "Content Delivery Network (CDN)"
        content: |
          Use this category for CDN and edge acceleration products. Profile notes should distinguish product availability from ICP filing requirements.

          Typical global services: [Amazon CloudFront](/alternatives/amazon-cloudfront.html), [Cloudflare CDN](/alternatives/cloudflare-cdn.html), [Akamai](/alternatives/akamai.html).

  - category: "Application Platform"
    content: |
      Application platform services support app frameworks, backend services, and remote configuration. Chinaready keeps this category conservative: Firebase-style suites, app hosting platforms, and remote configuration products are only mapped when the China-market service covers a comparable workflow.
    subcategories:
      - subcategory: "Cross-Platform UI & Frameworks"
        content: |
          Use this category for developer frameworks and UI runtimes. China-specific alternatives are still sparse and should be added with source-backed product evidence.

          Typical global services: React Native, Flutter, Ionic.
      - subcategory: "Mobile Backend-as-a-Service (MBaaS)"
        content: |
          Use this category for managed backend services for mobile and web apps. Some mapped options are partial deployment routes rather than full MBaaS replacements.

          Typical global services: [Firebase](/alternatives/firebase.html), [AWS Amplify](/alternatives/aws-amplify.html), [Supabase](/alternatives/supabase.html), [Heroku](/alternatives/heroku.html).
      - subcategory: "Feature Flags & Remote Config"
        content: |
          Use this category for remote configuration and feature flag services. Cross-listed mobile suites should clarify which module provides this capability.

          Typical global services: LaunchDarkly, Firebase Remote Config, ConfigCat.

  - category: "Release, Quality & Operations"
    content: |
      Release, quality, and operations services help teams test, distribute, monitor, and stabilize applications after launch. Chinaready profile notes should call out mobile device fragmentation, app-store distribution, local telemetry compliance, and whether a global tool remains viable through self-hosting or China-region deployment.
    subcategories:
      - subcategory: "CI/CD & App Distribution"
        content: |
          Use this category for build, deployment, and app distribution products. Explicit China alternative evidence is still limited and should be expanded carefully.

          Typical global services: GitHub Actions, Bitrise, Fastlane.
      - subcategory: "Automated Testing & Device Farms"
        content: |
          Use this category for real-device testing, cloud phones, and automated QA platforms.

          Typical global services: [AWS Device Farm](/alternatives/aws-device-farm.html), [Firebase Test Lab](/alternatives/firebase-test-lab.html), [BrowserStack App Automate](/alternatives/browserstack-app-automate.html).
      - subcategory: "Crash Reporting & Performance Monitoring"
        content: |
          Use this category for crash, stability, and mobile performance tools. Self-hosted global tools can be referenced in notes but should not be treated as China products by default.

          Typical global services: Sentry, [Firebase Crashlytics](/alternatives/firebase-crashlytics.html), Bugsnag.
      - subcategory: "Monitoring & Observability (APM / RUM)"
        content: |
          Use this category for infrastructure and application monitoring. Coverage is currently thin and should be expanded with official product references.

          Typical global services: Datadog, New Relic, Grafana Cloud.

  - category: "Users, Trust & Monetization"
    content: |
      Users, trust, and monetization services cover identity, payment, in-app purchase, CAPTCHA, and anti-bot workflows. For Chinaready, this is a core decision area because China-market implementations often depend on local payment rails, real-name expectations, and ecosystem-specific login.
    subcategories:
      - subcategory: "Authentication & Identity"
        content: |
          Use this category for identity providers, login systems, and authentication platforms.

          Typical global services: [Auth0](/alternatives/auth0.html), [Okta](/alternatives/okta.html), [Firebase Authentication](/alternatives/firebase-authentication.html), [Amazon Cognito](/alternatives/amazon-cognito.html).
      - subcategory: "Payments & In-App Purchases"
        content: |
          Use this category for payment rails and app monetization services. Profile notes should distinguish payment gateways, super-app payment ecosystems, and managed integration services.

          Typical global services: [Stripe](/alternatives/stripe.html), [PayPal](/alternatives/paypal.html), [Apple Pay](/alternatives/apple-pay.html).
      - subcategory: "Bot Protection & CAPTCHA"
        content: |
          Use this category for human verification, CAPTCHA, bot defense, and abuse-prevention products.

          Typical global services: [Google reCAPTCHA](/alternatives/google-recaptcha.html), [hCaptcha](/alternatives/hcaptcha.html), [Cloudflare Turnstile](/alternatives/cloudflare-turnstile.html).

  - category: "Engagement & Communication"
    content: |
      Engagement and communication services cover push, SMS, email, real-time media, chat, and support messaging. Chinaready treats push and messaging as a China-specific operating concern because Google FCM is often unavailable or unreliable for mainland China Android devices.
    subcategories:
      - subcategory: "Push Notifications & Multichannel Messaging"
        content: |
          Use this category for push notification, SMS, email, and messaging-delivery products.

          Typical global services: [Firebase Cloud Messaging](/alternatives/firebase-cloud-messaging.html), [OneSignal](/alternatives/onesignal.html), [Twilio SMS](/alternatives/twilio-sms.html), [SendGrid](/alternatives/sendgrid.html).
      - subcategory: "Real-Time Communication (Voice / Video / Chat)"
        content: |
          Use this category for RTC, voice, video, and chat infrastructure.

          Typical global services: [Twilio Video](/alternatives/twilio-video.html), [Agora](/alternatives/agora.html), [Daily](/alternatives/daily.html).
      - subcategory: "Customer Support & In-App Messaging"
        content: |
          Use this category for support chat, helpdesk, and in-app customer messaging. Evidence needs expansion before first-class product population.

          Typical global services: Intercom, Zendesk, Freshdesk.

  - category: "Growth, Content & Experience"
    content: |
      Growth, content, and experience services support analytics, attribution, maps, fonts, and user-facing product experience. The landscape separates China product alternatives from compatibility routes, because global maps, attribution, and font CDNs may be unavailable or slow in mainland China.
    subcategories:
      - subcategory: "Product Analytics & User Insights"
        content: |
          Use this category for analytics platforms and user behavior insight products.

          Typical global services: [Mixpanel](/alternatives/mixpanel.html), [Amplitude](/alternatives/amplitude.html), [PostHog](/alternatives/posthog.html), [Firebase Analytics](/alternatives/firebase-analytics.html).
      - subcategory: "Location & Map Services"
        content: |
          Use this category for map, location, geocoding, routing, and navigation APIs.

          Typical global services: [Google Maps Platform](/alternatives/google-maps-platform.html), [Mapbox](/alternatives/mapbox.html), [Apple MapKit](/alternatives/apple-mapkit.html).
      - subcategory: "App-Store Intelligence & Attribution (ASO)"
        content: |
          Use this category for app-store intelligence, attribution, and ASO tooling. China app-store fragmentation should be covered in profile notes.

          Typical global services: AppsFlyer, Adjust, Branch.
      - subcategory: "Web Fonts & Iconography"
        content: |
          Use this category for font and icon delivery services. Self-hosting is an implementation route and belongs in guide notes unless represented by a concrete service.

          Typical global services: [Google Fonts](/alternatives/google-fonts.html).

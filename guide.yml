categories:
  - category: "Overview"
    content: |
      Chinaready Landscape is an open-source map of China-ready developer services for global software teams. It helps developers translate familiar global-service keywords into practical China-market alternatives, understand local operating constraints, and discover source-backed product profiles before planning a China launch.

      The primary audience is foreign developer and product teams evaluating how to adapt a global software stack for mainland China.

      Start with the interactive landscape grid, then use the dedicated [China alternatives index](https://landscape.chinaready.co/alternatives/) when you already know a global dependency such as Firebase, FCM, AWS, Stripe, or Google Maps. For the broader launch operating model beyond vendor selection, continue on [chinaready.co](https://chinaready.co).

      ## Common global stack translations

      These are high-intent starting points, not exhaustive endorsements:

      - Firebase / FCM style mobile backends and push often need China SaaS or China cloud modules instead of a global Firebase default.
      - AWS, Azure, and similar clouds may require China-region accounts or a domestic cloud platform.
      - Stripe, PayPal, and Apple Pay style checkout usually map to WeChat Pay, Alipay, or a local commerce integration path.
      - Google Maps, Google Fonts, and some global CDNs may be unavailable, slow, or operationally constrained in mainland China.

      Browse the full keyword map at [landscape.chinaready.co/alternatives](https://landscape.chinaready.co/alternatives/).

      ## FAQ

      **What is Chinaready Landscape?**
      It is an open-source, continuously updated catalog of China-market developer services and China-region routes, organized so global teams can compare familiar tools with practical mainland China options.

      **Is a China alternative always a one-to-one product swap?**
      No. Some entries are direct alternatives, some are China-region deployments of global providers, and others are partial or ecosystem-specific routes. Read the replacement fit and China context before changing architecture.

      **Who maintains this resource?**
      Chinaready maintains the landscape as a public research resource. Product inclusion is source-backed and incomplete by design; empty subcategories remain visible so contributors can fill gaps.

      **Where should teams go after shortlisting vendors?**
      Use this site to understand the service map, then use [chinaready.co](https://chinaready.co) for launch process, compliance, distribution, and go-to-market guidance.

      The project deliberately reuses CNCF `landscape2` conventions: contributors edit YAML data, add SVG logos, run validation, and review changes through pull requests. This keeps the workflow familiar for landscape2 contributors while making the taxonomy and profiles specific to China's internet technology ecosystem.


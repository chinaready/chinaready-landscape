categories:
  - category: "Overview"
    content: |
      Chinaready Landscape is an open-source map of China-ready developer services for global software teams. It organizes mainland China technology options from Level 1 categories down to Level 2 subcategories, with notes on which familiar global services usually sit in each area.

      The primary audience is foreign developer and product teams evaluating how to adapt a global software stack for mainland China.

      Use this Guide to understand the China-side taxonomy and what typically belongs in each category. When you already know a global product keyword (Firebase, AWS, Stripe, Google Maps, and similar), open **Global** for the table index that maps international services to China-ready candidates. For the broader launch operating model beyond vendor selection, continue on [chinaready.co](https://chinaready.co).

      ## Common global stack translations

      These are high-intent starting points for reading the taxonomy below, not exhaustive endorsements:

      - Firebase / FCM style mobile backends and push often need China SaaS or China cloud modules instead of a global Firebase default.
      - AWS, Azure, and similar clouds may require China-region accounts or a domestic cloud platform.
      - Stripe, PayPal, and Apple Pay style checkout usually map to WeChat Pay, Alipay, or a local commerce integration path. Decide by deployment location first: products that stay outside China can often keep Stripe as a global platform (including Alipay and WeChat Pay for Chinese users); products that must run inside mainland China usually should not use Stripe for compliance reasons and should integrate native rails instead.
      - Google Maps, Google Fonts, and some global CDNs may be unavailable, slow, or operationally constrained in mainland China.

      ## FAQ

      **Does Firebase, AWS, or Stripe work in China?**
      Often with limits or not as a drop-in default. For Stripe specifically, answer the deployment question first: if the product must run in mainland China, Chinaready recommends native payment rails (WeChat Pay, Alipay, Youzan Cloud) rather than Stripe; if the product stays outside China, Stripe can still work globally. Open **Global** to check Availability in China and compare mapped China-ready candidates before you change architecture.

      **What is Chinaready Landscape?**
      It is an open-source, continuously updated catalog of China-market developer services and China-region routes, organized so global teams can compare familiar tools with practical mainland China options.

      **Is a China alternative always a one-to-one product swap?**
      No. Some entries are direct alternatives, some are China-region deployments of global providers, and others are partial or ecosystem-specific routes. Read the replacement fit and China context before changing architecture.

      **Where do I look up a specific global service?**
      Open **Global** in the navigation for the crawlable [international → China alternatives index](/alternatives/). This Guide stays focused on the China taxonomy from Level 1 categories to Level 2 subcategories.

      **Who maintains this resource?**
      Chinaready maintains the landscape as a public research resource. Product inclusion is source-backed and incomplete by design; empty subcategories remain visible so contributors can fill gaps.

      **Where should teams go after shortlisting vendors?**
      Use this site to understand the service map, then use [chinaready.co](https://chinaready.co) for launch process, compliance, distribution, and go-to-market guidance.

      The project deliberately reuses CNCF `landscape2` conventions: contributors edit YAML data, add SVG logos, run validation, and review changes through pull requests. This keeps the workflow familiar for landscape2 contributors while making the taxonomy and profiles specific to China's internet technology ecosystem.


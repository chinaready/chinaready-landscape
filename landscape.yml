      - subcategory:
        name: Network & Edge Security
        items:
          - item:
            name: Coremail (CACTER邮件安全网关)
            homepage_url: https://www.coremail.cn/product_13.html
            logo: coremail.svg
            description: Coremail's CACTER email security gateway is a mainland China email-security product for anti-spam, anti-phishing, malware, and BEC defense, commonly evaluated when replacing Barracuda and similar foreign gateways.
            extra:
              annotations:
                global_analogs: Barracuda
                replacement_fit: direct
                china_context: "Coremail is a well-known China email and email-security vendor with 22+ years in the category, and is frequently evaluated as a confidence choice when replacing foreign gateways such as Trend Micro (趋势科技), Barracuda (梭子鱼), and 守内安. CACTER strengths include high-precision interception and anti-phishing (claimed ~99.8% spam accuracy and <0.02% false positives), large-scale mainland honeypot/sample collection for evolving Chinese phishing tactics, exclusive in-domain anomaly detection plus automatic recall/isolation for delivered threats, and a China-hosted anti-spam big-data center (CAC) aligned with domestic data-security and Cybersecurity Law expectations. Mature replacement programs already cover banks, securities, funds, insurance, and government/enterprise users, with cloud, software, and hardware deployment options compatible with Coremail, Exchange, Microsoft 365, Gmail, and other mainstream mail systems."
                vendor_type: china-saas
                evidence_level: medium
                availability_status: generally-available
                global_availability_in_china: limited
                metadata_name: "Coremail (CACTER邮件安全网关)"
                primary_category: "Infrastructure & Edge"
                official_website: "https://www.coremail.cn/product_13.html"
                github: "to-be-supplied-by-contributor"
                social_media: "to-be-supplied-by-contributor"
                product_overview: "Coremail's CACTER email security gateway provides mainland China email threat protection — anti-spam, anti-phishing, malware, and BEC defense — with in-domain recall, China-hosted threat intelligence, and cloud/software/hardware deployment options for replacing foreign email gateways."
                alternative_to: "China-market alternative or deployment route for: Barracuda."
                global_alternatives: "Barracuda"
                organization: "Coremail"
                organization_overview: "Coremail is a China email platform and email-security vendor. Its CACTER gateway is commonly evaluated for mainland replacements of Barracuda and other foreign email security gateways."
                developer_docs: "https://www.coremail.cn/product_13.html"
